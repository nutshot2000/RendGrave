[package]
name = "pixel_arpg"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"
pollster = "1.0.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
wgpu = "30.0.1"
winit = "0.30.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
codegen-units = 16
